# Profilul de producție (Render): activat cu SPRING_PROFILES_ACTIVE=prod.
#
# Conexiunea vine din variabile de mediu. Două variante, oricare merge:
#  1. DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD (render.yaml le leagă de baza Render)
#  2. DATABASE_URL=postgresql://user:parola@host:port/db (URL-ul copiat din dashboard-ul Render);
#     DatabaseUrlEnvironmentPostProcessor îl desface în variabilele de la punctul 1.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}${DB_QUERY:}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Instanța gratuită are 512 MB RAM, iar Postgres-ul gratuit un număr mic de conexiuni
spring.datasource.hikari.maximum-pool-size=5

# Schema se creează la prima pornire și se actualizează la fiecare deploy (coloane/tabele noi)
spring.jpa.hibernate.ddl-auto=update

# Pe Render discul containerului e efemer: pozele se pierd la redeploy (compromis asumat, vezi README)
sidequest.uploads-dir=${UPLOADS_DIR:uploads}
