spring.application.name=sidequest

# Render (și alte platforme) dau portul în variabila PORT; local rămâne 8080
server.port=${PORT:8080}

# Profilul implicit (dezvoltare locală): H2 în fișier, datele supraviețuiesc restartului
# (backend/data/sidequest.mv.db). În producție, profilul "prod" trece pe PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/sidequest
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Momentele de timp se serializează ISO-8601, nu ca timestamp numeric
spring.jackson.serialization.write-dates-as-timestamps=false

# Pozele-dovadă: fișiere locale în backend/uploads/ (folderul se creează automat la pornire)
sidequest.uploads-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# CORS: originile frontend-ului care pot apela API-ul, separate prin virgulă. Acceptă și
# pattern-uri, ex. FRONTEND_URL=https://sidequest.vercel.app,https://sidequest-*.vercel.app
sidequest.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Doar /actuator/health e expus (health check pentru Render), fără detalii interne
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
