spring.application.name=sidequest

# H2 în fișier: datele supraviețuiesc restartului (backend/data/sidequest.mv.db)
spring.datasource.url=jdbc:h2:file:./data/sidequest
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Momentele de timp se serializează ISO-8601, nu ca timestamp numeric
spring.jackson.serialization.write-dates-as-timestamps=false

# Pozele-dovadă: fișiere locale în backend/uploads/ (folderul se creează automat la pornire)
sidequest.uploads-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
