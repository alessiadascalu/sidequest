spring.application.name=sidequest-test

# Bază de date în memorie, izolată de fișierul folosit în dezvoltare
spring.datasource.url=jdbc:h2:mem:sidequest-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Upload-urile din teste merg în target/, nu în folderul real
sidequest.uploads-dir=target/test-uploads

# CORS în teste: o origine exactă și un pattern (ca preview-urile Vercel)
sidequest.cors.allowed-origins=http://localhost:5173,https://sidequest-*.vercel.app
